# USAGE: python sera/main.py --config-name specialization_typescript stage=pipeline name=test
# TypeScript specialization config — adapt repos list as needed

defaults:
  - sera
  - _self_

name: specialize_typescript

generate:
  fns_per_repo: 5000
  insts_per_fn: 1
  personal_repos:
    - org_name: colinhacks
      last_name: zod
      language: typescript
      commits: # Provide exact commits or we auto-scrape equally spaced ones
      install_cmds:
        - "pnpm install --frozen-lockfile"
      test_cmd: "pnpm test"
      node_version: "20"
      package_manager: pnpm
      test_framework: vitest
      tsc_verify: true
      top_level_folder:
        - src
    - org_name: honojs
      last_name: hono
      language: typescript
      install_cmds:
        - "pnpm install --frozen-lockfile"
      test_cmd: "pnpm test"
      node_version: "20"
      package_manager: pnpm
      test_framework: vitest
      tsc_verify: true
      top_level_folder:
        - src
    # vuejs/core removed — monorepo OOM's Jelly at 4GB heap
    # TODO: replace with valibot or ts-pattern

distill:
  model:
    name: openai/glm-4.5-air
    url: https://api.z.ai/api/coding/paas/v4/
  args: {}
  sweagent_wrapper_config:
    num_workers: 8

postprocess:
  tool_call_format: hermes
  add_think: false
  add_train_key: true
  enforce_submit: true
  reformat_assistant_message: keep_only_think

eval:
  compare_patch_threshold: 0.5
